<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Firma contrato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">

        <h2>Firma de contrato</h2>

        <div id="estado">Cargando contrato...</div>

        <iframe id="pdfViewer" style="width:100%; height:600px; border:1px solid #ccc; display:none;">
        </iframe>

        <br><br>

        <button class="btn btn-primary" onclick="abrirAutoFirma()">
            Firmar con AutoFirma
        </button>

    </div>

    <script src="./js/autoscript.js"></script>

    <script>
        const API = "http://localhost:3000";

        let token = null;

        function obtenerToken() {
            return new URLSearchParams(location.search).get("token");
        }

        async function cargar() {

            token = obtenerToken();

            const r = await fetch(`${API}/api/contratos/firma/${token}`);
            const data = await r.json();

            if (data.error) {
                document.getElementById("estado").innerText = data.error;
                return;
            }

            document.getElementById("estado").innerText = "Contrato listo";

            const viewer = document.getElementById("pdfViewer");
            viewer.style.display = "block";
            viewer.src = `${API}/uploads/contratos/${data.FICHERO_NOMBRE}`;
        }

        function blobToBase64(blob) {

            return new Promise(resolve => {

                const reader = new FileReader();

                reader.onload = () => {

                    resolve(reader.result.split(",")[1]);

                };

                reader.readAsDataURL(blob);

            });

        }

        function base64ToBlob(base64) {

            const binary = atob(base64);

            const bytes = new Uint8Array(binary.length);

            for (let i = 0; i < binary.length; i++)
                bytes[i] = binary.charCodeAt(i);

            return new Blob([bytes], {
                type: "application/pdf"
            });

        }

        async function abrirAutoFirma() {

            try {

                document.getElementById("estado").innerText = "Preparando documento...";

                const r = await fetch(`${API}/api/contratos/descargar/${token}`);

                const pdfBlob = await r.blob();

                const pdf64 = await blobToBase64(pdfBlob);

                AutoScript.cargarAppAfirma();

                AutoScript.sign(

                    pdf64,

                    "SHA256withRSA",

                    "PAdES",

                    "",

                    async function (pdfFirmado64) {

                        document.getElementById("estado").innerText = "Subiendo contrato firmado...";

                        const blobFirmado = base64ToBlob(pdfFirmado64);

                        const form = new FormData();

                        form.append(
                            "pdfFirmado",
                            blobFirmado,
                            "contrato_firmado.pdf"
                        );

                        form.append(
                            "token",
                            token
                        );

                        const subida = await fetch(

                            `${API}/api/contratos/autofirma/return`,

                            {
                                method: "POST",
                                body: form
                            }

                        );

                        const json = await subida.json();

                        if (json.error) {
                            alert(json.error);
                            return;
                        }

                        document.getElementById("estado").innerText = "Contrato firmado correctamente";

                        alert("Contrato firmado correctamente");

                    },

                    function (tipo, error) {

                        console.error(error);

                        alert("Error AutoFirma:\n" + error);

                    }

                );

            }

            catch (e) {

                console.error(e);

                alert(e.message);

            }

        }

        cargar();

    </script>

</body>

</html>
