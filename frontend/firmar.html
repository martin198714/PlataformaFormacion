<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Firma contrato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">

        <h2>Firma de contrato</h2>

        <div id="estado">Cargando contrato...</div>

        <iframe id="pdfViewer" style="width:100%; height:600px; border:1px solid #ccc; display:none;">
        </iframe>

        <br><br>

        <button class="btn btn-primary" onclick="abrirAutoFirma()">
            Firmar con AutoFirma
        </button>

    </div>

    <script>

        const API = "http://localhost:3000";

        let token = null;

        function obtenerToken() {

            return new URLSearchParams(location.search).get("token");

        }

        async function cargar() {

            try {

                token = obtenerToken();

                if (!token)
                    throw new Error("Token inválido");

                const r = await fetch(`${API}/api/contratos/firma/${token}`);

                const data = await r.json();

                if (!r.ok)
                    throw new Error(data.error);

                document.getElementById("estado").innerText = "Contrato listo para firma";

                if (data.FICHERO_NOMBRE) {

                    document.getElementById("pdfViewer").style.display = "block";

                    document.getElementById("pdfViewer").src =
                        `${API}/uploads/contratos/${data.FICHERO_NOMBRE}`;

                }

            }
            catch (e) {

                document.getElementById("estado").innerText = e.message;

            }

        }

        async function abrirAutoFirma() {

            try {

                const r = await fetch(`${API}/api/contratos/descargar/${token}`);

                if (!r.ok)
                    throw new Error("Error descargando contrato");

                const blob = await r.blob();

                const url = URL.createObjectURL(blob);

                const a = document.createElement("a");

                a.href = url;

                a.download = `contrato_TOKEN_${token}.pdf`;

                a.click();

                URL.revokeObjectURL(url);

                document.getElementById("estado").innerText =
                    "Firma el PDF con AutoFirma. Cuando el watcher detecte el PDF firmado se subirá automáticamente.";

            }
            catch (e) {

                document.getElementById("estado").innerText = e.message;

            }

        }

        cargar();

    </script>

</body>

</html>
