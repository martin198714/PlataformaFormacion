<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Firma contrato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container mt-5">

        <h2>Firma de contrato</h2>

        <div id="estado">Cargando contrato...</div>

        <iframe id="pdfViewer" style="width:100%; height:600px; border:1px solid #ccc; display:none;">
        </iframe>

        <br><br>

        <button class="btn btn-primary" onclick="abrirAutoFirma()">
            Firmar con AutoFirma
        </button>

    </div>

    <script src="./js/autoscript.js"></script>
    <script>
        const API = "http://localhost:3000";

        let token = null;

        /* =========================
           TOKEN
        ========================= */

        function obtenerToken() {
            return new URLSearchParams(location.search).get("token");
        }

        /* =========================
           CARGAR CONTRATO
        ========================= */

        async function cargar() {
            try {
                token = obtenerToken();

                if (!token)
                    throw new Error("Token inválido");

                const r = await fetch(`${API}/api/contratos/firma/${token}`);
                const data = await r.json();

                if (!r.ok || data.error)
                    throw new Error(data.error || "Error cargando contrato");

                document.getElementById("estado").innerText =
                    "Contrato listo para firma";

                const fichero = data.FICHERO_NOMBRE || data.fichero_nombre;

                if (fichero) {
                    const viewer = document.getElementById("pdfViewer");
                    viewer.style.display = "block";
                    viewer.src = `${API}/uploads/contratos/${fichero}`;
                }

            } catch (e) {
                document.getElementById("estado").innerText = e.message;
            }
        }

        /* =========================
           DESCARGA PARA AUTOFIRMA
        ========================= */

        async function abrirAutoFirma() {
            try {
                const r = await fetch(`${API}/api/contratos/descargar/${token}`);

                if (!r.ok)
                    throw new Error("Error descargando contrato");

                const blob = await r.blob();

                const url = window.URL.createObjectURL(blob);

                const a = document.createElement("a");
                a.href = url;

                a.download = `contrato_${token}.pdf`;
                document.body.appendChild(a);

                a.click();

                a.remove();
                URL.revokeObjectURL(url);

                document.getElementById("estado").innerText =
                    "Abre el PDF con AutoFirma, fírmalo y espera la subida automática.";

            } catch (e) {
                document.getElementById("estado").innerText = e.message;
            }
        }

        /* =========================
           INIT
        ========================= */

        cargar();
    </script>

</body>

</html>
