<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Firma de contrato</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/firmar.css">
</head>

<body>
    
    <main id="contenido" role="main">

        <div id="estado" class="info">Cargando contrato...</div>

        <!-- =========================
         VISOR PDF
        ========================= -->
        <iframe id="pdfViewer" style="width:100%; height:500px; border:1px solid #ccc; border-radius:8px;"></iframe>

        <!-- fallback -->
        <p id="pdfError" style="color:red; display:none;">
            ⚠ No se pudo cargar el PDF del contrato
        </p>

        <!-- =========================
         SUBIR FIRMA
        ========================= -->
        <h3>Subir contrato firmado</h3>

        <input type="file" id="file" accept="application/pdf" />

        <br><br>

        <button class="btn" onclick="subirFirma()">
            ✔ Firmar contrato
        </button>

        <!-- resultado -->
        <div id="resultado" class="info"></div>

    </main>

    <!-- JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>
    <script>
        const BASE_URL = "http://localhost:3000";

        let token = null;
        let contrato = null;

        function getToken() {
            return new URLSearchParams(window.location.search).get("token");
        }

        async function cargarContrato() {
            try {
                token = getToken();

                if (!token) {
                    document.getElementById("estado").innerText = "❌ Token no válido";
                    return;
                }

                const res = await fetch(`${BASE_URL}/api/contratos/firma/${token}`);
                const data = await res.json();

                if (!res.ok) {
                    document.getElementById("estado").innerText =
                        data.error || "❌ Contrato no encontrado";
                    return;
                }

                contrato = data;

                document.getElementById("estado").innerText =
                    "✔ Contrato listo para firma";

                const pdfViewer = document.getElementById("pdfViewer");

                const fileName =
                    data.FICHERO_NOMBRE ||
                    data.fileName ||
                    data.ARCHIVO_NOMBRE;

                if (fileName) {
                    pdfViewer.src = `${BASE_URL}/uploads/contratos/${fileName}`;
                } else {
                    document.getElementById("estado").innerText =
                        "⚠ Este contrato no tiene PDF asociado";
                }

            } catch (err) {
                console.error(err);
                document.getElementById("estado").innerText =
                    "❌ Error cargando contrato";
            }
        }

        async function subirFirma() {
            try {
                const file = document.getElementById("file").files[0];

                if (!file) return alert("Selecciona un PDF firmado");
                if (!token) return alert("Token inválido");

                const formData = new FormData();
                formData.append("pdf", file); // ✔ ESTO ES CORRECTO

                const res = await fetch(
                    `${BASE_URL}/api/contratos/firmar/token/${token}`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const data = await res.json();

                if (!res.ok) {
                    throw new Error(data.error || "Error al firmar");
                }

                document.getElementById("resultado").innerText =
                    "✔ PDF firmado subido correctamente";

                document.getElementById("estado").innerText =
                    "✔ Contrato firmado";

                console.log("RESPUESTA:", data);

            } catch (err) {
                console.error(err);
                document.getElementById("resultado").innerText =
                    err.message;
            }
        }

        cargarContrato();
    </script>

</body>

</html>
