    <meta property="og:description"
        content="Descarga recursos formativos, documentos y guías educativas de Ejidosoft Formación.">
    <meta property="og:url" content="https://ejidosoft.es/descargas">

    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <link rel="icon" type="image/webp" href="img/logo.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/admin_archivos.css">
    <link rel="stylesheet" href="css/admin_usuarios.css">
    <link rel="stylesheet" href="css/descargas.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg" role="navigation" aria-label="Menú principal">
        <div class="container">

            <a class="navbar-brand" href="admin.html"
                aria-label="Ir al panel de administración Ejidosoft Formación"></a>

            <div class="ms-auto">
                <a href="index.html" class="btn btn-warning" aria-label="Volver a la página anterior">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    Volver
                </a>
            </div>

        </div>
    </nav>

    <header class="encabezado-login" role="banner">
        <div class="container">
            <div class="row align-items-center text-center text-md-start">

                <div class="col-md-4">
                    <img src="img/logo.png" width="180" height="60" class="img-fluid logo-login"
                        alt="Logo de Ejidosoft Formación" loading="eager" decoding="async">
                </div>

                <div class="col-md-8">
                    <h1 class="fw-bold titulo-formulario">
                        <i class="fa-solid fa-download" aria-hidden="true"></i>
                        Descargar Archivos
                    </h1>
                </div>

            </div>
        </div>
    </header>

    <main class="container my-5" role="main">

        <section id="archivosContainer"
            aria-live="polite"
            aria-busy="false"
            aria-label="Listado de archivos descargables">
        </section>

    </main>

    <footer class="text-center py-3 text-white" role="contentinfo">
        <div class="container">
            <div class="row">

                <div class="col-6 col-md-2"></div>
                <div class="col-6 col-md-2"></div>

                <div class="col-6 col-md-2">
                    © 2026 Ejidosoft Formación
                </div>

                <div class="col-6 col-md-2"></div>

                <div class="col-6 col-md-2">
                    <img src="img/logo-pie.png" alt="Logo Ejidosoft Formación" loading="lazy" decoding="async">
                </div>

                <div class="col-md-2 footer-contacto ms-auto text-md-end">
                    C/Jaén nº18-20 04700<br>
                    El Ejido (Almería)<br>
                    Telf.: 950 48 73 99<br>
                    info@ejidosoft.es
                </div>

            </div>
        </div>
    </footer>

    <script>
        const API = "http://localhost:3000/api/archivos";
        const token = localStorage.getItem("token");

        async function cargarArchivos() {

            const container = document.getElementById('archivosContainer');
            container.setAttribute("aria-busy", "true");

            try {

                const response = await fetch(`${API}/publicos`, {
                    cache: "force-cache",
                    headers: {
                        Authorization: "Bearer " + token
                    }
                });

                if (!response.ok) throw new Error();

                const archivos = await response.json();

                container.innerHTML = '';

                if (!archivos.length) {
                    container.innerHTML =
                        '<p class="text-center text-muted">No hay archivos disponibles</p>';
                    return;
                }

                const ORDEN_TITULOS = {
                    "Planning 4.0": 1,
                    "Transporta 4.0": 2,
                    "Base 4.0": 3,
                    "Gestion Horto 4.0": 4,
                    "Contasoft 4.0": 5,
                    "SII 4.0": 6,
                    "Fiscal 4.0": 7,
                    "Verifactu 4.0": 8
                };

                const porTitulo = {};

                for (const a of archivos) {
                    const titulo = a.TITULO || "Sin título";
                    (porTitulo[titulo] ??= []).push(a);
                }

                const titulosOrdenados = Object.keys(porTitulo).sort(
                    (a, b) => (ORDEN_TITULOS[a] ?? 999) - (ORDEN_TITULOS[b] ?? 999)
                );

                let index = 0;

                for (const titulo of titulosOrdenados) {

                    const id = "col" + index;

                    const h2 = document.createElement('h2');
                    h2.className = "mt-4 titulo-colapsable";
                    h2.textContent = titulo;

                    h2.setAttribute("role", "button");
                    h2.setAttribute("tabindex", "0");
                    h2.setAttribute("data-bs-toggle", "collapse");
                    h2.setAttribute("data-bs-target", "#" + id);
                    h2.setAttribute("aria-expanded", "true");
                    h2.setAttribute("aria-controls", id);

                    h2.addEventListener("keydown", (e) => {
                        if (e.key === "Enter" || e.key === " ") {
                            e.preventDefault();
                            h2.click();
                        }
                    });

                    container.appendChild(h2);

                    const div = document.createElement('div');
                    div.className = "collapse show";
                    div.id = id;

                    const table = document.createElement('table');
                    table.className = "table table-bordered table-striped table-fixed mt-2";
                    table.setAttribute("role", "table");

                    table.innerHTML = `
                        <thead class="table-primary">
                            <tr>
                                <th scope="col" class="text-center">Tipo</th>
                                <th scope="col">Descripción</th>
                                <th scope="col" class="text-center">Descargar</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    `;

                    const tbody = table.querySelector('tbody');

                    for (const file of porTitulo[titulo]) {

                        const ext = (file.FICHERO_NOMBRE || '').split('.').pop().toLowerCase();

                        let icon = '<i class="fa fa-file text-primary"></i>';

                        if (ext === 'pdf')
                            icon = '<img src="img/pdf.png" class="card-icon" alt="PDF">';
                        else if (ext.includes('doc'))
                            icon = '<img src="img/word.png" class="card-icon" alt="Word">';
                        else if (ext.includes('xls'))
                            icon = '<img src="img/excel.png" class="card-icon" alt="Excel">';
                        else if (ext === 'zip' || ext === 'rar')
                            icon = '<img src="img/zip.png" class="card-icon" alt="ZIP">';

                        const tr = document.createElement('tr');

                        tr.innerHTML = `
                            <td class="text-center">${icon}</td>
                            <td>${file.DESCRIPCION || ''}</td>
                        `;

                        const td = document.createElement('td');
                        td.className = "text-center";

                        const btn = document.createElement('button');
                        btn.className = 'btn btn-warning btn-sm';
                        btn.innerHTML = '<i class="fa fa-download" aria-hidden="true"></i>';
                        btn.setAttribute("aria-label", "Descargar archivo");

                        btn.onclick = () => descargarArchivo(file.ARCHIVO_ID);

                        td.appendChild(btn);
                        tr.appendChild(td);
                        tbody.appendChild(tr);
                    }

                    div.appendChild(table);
                    container.appendChild(div);

                    index++;
                }

            } catch (e) {
                container.innerHTML =
                    '<p class="text-danger text-center">Error cargando archivos</p>';
            } finally {
                container.setAttribute("aria-busy", "false");
            }
        }

        function descargarArchivo(id) {

            if (!token) {
                alert("No tienes sesión iniciada");
                return;
            }

            fetch(`${API}/descargar/${id}`, {
                headers: { Authorization: "Bearer " + token }
            })
                .then(r => r.ok ? r.blob() : Promise.reject())
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = "";
                    a.click();
                    URL.revokeObjectURL(url);
                })
                .catch(() => alert("No tienes acceso a este archivo"));
        }

        document.addEventListener('DOMContentLoaded', cargarArchivos);
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
