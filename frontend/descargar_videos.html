<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <meta name="description"
        content="Descarga capítulos formativos de Ejidosoft Formación. Accede a vídeos organizados por módulos y descarga según permisos de usuario.">
    <meta name="robots" content="index, follow">

    <title>Descargar Capítulos - Ejidosoft Formación</title>

    <meta name="theme-color" content="#ffc107">

    <link rel="icon" type="image/webp" href="img/logo.png" />

    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/descargar_videos.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg" role="navigation" aria-label="Menú principal">
        <div class="container">

            <a class="navbar-brand" href="admin.html"
                aria-label="Ir al panel de administración Ejidosoft Formación"></a>

            <div class="ms-auto">
                <a href="index.html" class="btn btn-warning" aria-label="Volver">
                    <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                    Volver
                </a>
            </div>

        </div>
    </nav>

    <header class="encabezado-login" role="banner">
        <div class="container">
            <div class="row align-items-center text-center text-md-start">

                <div class="col-md-4">
                    <img src="img/logo.png" width="180" height="60" class="img-fluid logo-login"
                        alt="Logo Ejidosoft Formación" loading="eager" decoding="async" />
                </div>

                <div class="col-md-8">
                    <h1 class="fw-bold titulo-formulario">
                        <i class="fa-solid fa-download me-2" aria-hidden="true"></i>
                        Descargar Capítulos
                    </h1>
                </div>

            </div>
        </div>
    </header>

    <main class="container my-5" role="main">
        <section id="capitulosContainer" role="region" aria-live="polite" aria-busy="false"></section>
    </main>

    <footer class="text-center py-3 text-white" role="contentinfo">
        <div class="container">
            <div class="row">

                <div class="col-6 col-md-2"></div>
                <div class="col-6 col-md-2"></div>

                <div class="col-6 col-md-2">
                    © 2026 Ejidosoft Formación
                </div>

                <div class="col-6 col-md-2"></div>

                <div class="col-6 col-md-2">
                    <img src="img/logo-pie.png" alt="Logo Ejidosoft" loading="lazy" decoding="async">
                </div>

                <div class="col-md-2 footer-contacto ms-auto text-md-end">
                    C/Jaén nº18-20 04700<br>
                    El Ejido (Almería)<br>
                    Telf.: 950 48 73 99<br>
                    info@ejidosoft.es
                </div>

            </div>
        </div>
    </footer>

    <script>
        /* =========================
           PERF + TOKEN CACHE
        ========================= */
        const TOKEN_USUARIO = localStorage.getItem('token') || '';
        const container = document.getElementById('capitulosContainer');

        if (!TOKEN_USUARIO) {
            alert('Debes iniciar sesión para acceder a los capítulos');
            window.location.href = 'login.html';
        }

        /* ORDEN FIJO */
        const ORDEN_TITULOS = {
            "Planning 4.0": 1,
            "Transporta 4.0": 2,
            "Base 4.0": 3,
            "Gestion Horto 4.0": 4,
            "Contasoft 4.0": 5,
            "SII 4.0": 6,
            "Fiscal 4.0": 7,
            "Verifactu 4.0": 8
        };

        document.addEventListener('DOMContentLoaded', cargarCapitulos);

        async function cargarCapitulos() {
            try {
                container.setAttribute('aria-busy', 'true');

                const response = await fetch(
                    'http://localhost:3000/api/videos/capitulos/publicos',
                    {
                        headers: { Authorization: `Bearer ${TOKEN_USUARIO}` }
                    }
                );

                if (!response.ok) throw new Error('Error API');

                const capitulos = await response.json();

                container.innerHTML = '';

                if (!capitulos.length) {
                    container.innerHTML = `<p class="text-center text-muted">No hay capítulos disponibles.</p>`;
                    return;
                }

                /* agrupación optimizada */
                const porTitulo = capitulos.reduce((acc, c) => {
                    const t = c.TITULO || "Sin título";
                    (acc[t] ??= []).push(c);
                    return acc;
                }, {});

                const titulosOrdenados = Object.keys(porTitulo)
                    .sort((a, b) => (ORDEN_TITULOS[a] ?? 999) - (ORDEN_TITULOS[b] ?? 999));

                const fragment = document.createDocumentFragment();

                titulosOrdenados.forEach((titulo, index) => {

                    const collapseId = `cap_${index}`;

                    const h3 = document.createElement('h3');
                    h3.className = 'titulo-colapsable';
                    h3.textContent = titulo;

                    h3.setAttribute('data-bs-toggle', 'collapse');
                    h3.setAttribute('data-bs-target', `#${collapseId}`);
                    h3.setAttribute('role', 'button');
                    h3.setAttribute('tabindex', '0');

                    const div = document.createElement('div');
                    div.className = 'collapse show';
                    div.id = collapseId;

                    const table = document.createElement('table');
                    table.className = 'table table-bordered table-striped table-desc table-fixed mt-2';

                    table.innerHTML = `
                <thead class="table-primary">
                    <tr>
                        <th>Tipo</th>
                        <th>Descripción</th>
                        <th>Descargar</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;

                    const tbody = table.querySelector('tbody');

                    porTitulo[titulo].forEach(file => {

                        const tr = document.createElement('tr');
                        const bloqueado = !file.PUEDE_DESCARGAR;

                        tr.innerHTML = `
                    <td class="text-center">
                        <i class="fa-solid fa-video text-primary"></i>
                    </td>
                    <td>${file.DESCRIPCION || ''}</td>
                    <td class="text-center"></td>
                `;

                        const td = tr.querySelector('td:last-child');

                        const btn = document.createElement('button');

                        btn.className = bloqueado
                            ? 'btn btn-secondary btn-sm'
                            : 'btn btn-warning btn-sm';

                        btn.innerHTML = bloqueado
                            ? '<i class="fa-solid fa-lock"></i>'
                            : '<i class="fa-solid fa-download"></i>';

                        btn.disabled = bloqueado;

                        btn.dataset.id = file.CAPITULO_ID;
                        btn.dataset.nombre = file.FICHERO_NOMBRE || '';

                        td.appendChild(btn);
                        tbody.appendChild(tr);
                    });

                    div.appendChild(table);

                    fragment.appendChild(h3);
                    fragment.appendChild(div);
                });

                requestAnimationFrame(() => {
                    container.appendChild(fragment);
                    container.setAttribute('aria-busy', 'false');
                });

            } catch (err) {
                console.error(err);
                container.innerHTML = `<p class="text-danger text-center">Error cargando capítulos</p>`;
                container.setAttribute('aria-busy', 'false');
            }
        }

        /* =========================
           EVENT DELEGATION (MEJORA CLAVE)
        ========================= */
        container.addEventListener('click', async (e) => {

            const btn = e.target.closest('button');
            if (!btn || btn.disabled) return;

            await descargarCapitulo(btn, btn.dataset.id, btn.dataset.nombre);
        });

        async function descargarCapitulo(btn, id, nombre) {

            const original = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const res = await fetch(
                    `http://localhost:3000/api/videos/capitulos/${id}/descargar`,
                    {
                        headers: { Authorization: `Bearer ${TOKEN_USUARIO}` }
                    }
                );

                if (!res.ok) throw new Error('Sin permisos');

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = nombre || 'capitulo.mp4';
                a.click();

                URL.revokeObjectURL(url);

                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                btn.className = 'btn btn-success btn-sm';

            } catch (err) {
                alert(err.message || 'Error descarga');

                btn.disabled = false;
                btn.innerHTML = original;
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

</body>

</html>
